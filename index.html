
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - To-Do List</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>

        <div class="logo">
            Task<span>Flow</span>
        </div>

        <button id="themeBtn">🌙</button>

    </header>


    <!-- ================= MAIN CONTENT ================= -->
    <main>

        <!-- Hero Section -->
        <section class="hero">

            <h1>My Tasks</h1>

            <p>
                Organize your daily tasks and get things done.
            </p>

        </section>


        <!-- ================= STATISTICS ================= -->
        <section class="stats">

            <!-- Total Tasks -->
            <div class="stat">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <!-- Completed Tasks -->
            <div class="stat">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>

            <!-- Pending Tasks -->
            <div class="stat">
                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>
            </div>

        </section>


        <!-- ================= ADD TASK FORM ================= -->
        <section class="task-form">

            <!-- Task Name -->
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <!-- Category -->
            <select id="category">

                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Other">Other</option>

            </select>

            <!-- Priority -->
            <select id="priority">

                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>

            </select>

            <!-- Assigned Date -->
             <input
             type="date"
            id="assignedDate"
            title="Select Assigned Date"
            aria-label="Assigned Date">

            <!-- Due Date -->
            <input
            type="date"
            id="dueDate"
            title="Select Due Date"
            aria-label="Due Date">

            <!-- Add Task Button -->
            <button id="addBtn">
                + Add Task
            </button>

        </section>
        

        <!-- ================= SEARCH & FILTER ================= -->
        <section class="controls">

            <!-- Search -->
            <input
                type="text"
                id="search"
                placeholder="🔍 Search tasks..."
            >

            <!-- Filter -->
            <select id="filter">

                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
                <option value="high">High Priority</option>

            </select>

        </section>


        <!-- ================= TASK LIST ================= -->
        <section id="taskList"></section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer>

        <p>
            TaskFlow | Frontend Developer Internship Project
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
